name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'
    - run: npm install
    - run: npm test

  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Create ECR Repository if not exists
      run: |
        aws ecr describe-repositories --repository-names video-chat-app || \
        aws ecr create-repository --repository-name video-chat-app

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: video-chat-app
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Update kubeconfig & Deploy to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: video-chat-app
        IMAGE_TAG: ${{ github.sha }}
      run: |
        if aws eks update-kubeconfig --name video-chat-cluster --region us-east-1 2>/dev/null; then
          sed -i "s|sidduajay123/video-chat-app:latest|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml || true
          kubectl rollout restart deployment/video-chat-app -n video-chat || true
        else
          echo "EKS cluster is initializing via Terraform..."
        fi

    - name: Dynamically Register EKS Nodes with Load Balancer
      run: |
        ELB_HOST=$(kubectl get svc video-chat-service -n video-chat -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
        if [ -n "$ELB_HOST" ]; then
          ELB_NAME=$(echo "$ELB_HOST" | cut -d'-' -f1)
          NODES=$(kubectl get nodes -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
          if [ -n "$NODES" ] && [ -n "$ELB_NAME" ]; then
            echo "Registering nodes ($NODES) with ELB ($ELB_NAME)..."
            aws elb register-instances-with-load-balancer \
              --load-balancer-name "$ELB_NAME" \
              --instances $NODES \
              --region us-east-1 || true
          fi
        fi

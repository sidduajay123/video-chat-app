name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: video-chat-cluster
  ECR_REPOSITORY: video-chat-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 2

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # ─── Check for Infrastructure Changes ─────────────────────────────────────
    - name: Check for Infrastructure Changes
      id: check-changes
      run: |
        if git rev-parse HEAD~1 >/dev/null 2>&1; then
          DIFF_FILES=$(git diff --name-only HEAD~1 HEAD)
        else
          DIFF_FILES=$(git show --name-only --format="" HEAD)
        fi
        echo "Files changed in this commit:"
        echo "$DIFF_FILES"
        
        INFRA_CHANGED="false"
        if echo "$DIFF_FILES" | grep -E '^(terraform/|.*\.tf$|.*\.hcl$)'; then
          INFRA_CHANGED="true"
        fi
        echo "infra_changed=$INFRA_CHANGED"
        echo "infra_changed=$INFRA_CHANGED" >> $GITHUB_OUTPUT

    # ─── Setup Terraform (Conditional) ────────────────────────────────────────
    - name: Setup Terraform
      if: steps.check-changes.outputs.infra_changed == 'true'
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7

    - name: Terraform Init
      if: steps.check-changes.outputs.infra_changed == 'true'
      run: terraform init
      working-directory: ./terraform

    - name: Import existing AWS resources into Terraform state (idempotent)
      if: steps.check-changes.outputs.infra_changed == 'true'
      working-directory: ./terraform
      run: |
        # Import EKS cluster if not already tracked
        terraform state show aws_eks_cluster.video_chat_cluster > /dev/null 2>&1 || \
          terraform import aws_eks_cluster.video_chat_cluster video-chat-cluster || true

        # Import EKS node group if not already tracked
        terraform state show aws_eks_node_group.video_chat_nodes > /dev/null 2>&1 || \
          terraform import aws_eks_node_group.video_chat_nodes video-chat-cluster:video-chat-nodes || true

    - name: Terraform Plan
      if: steps.check-changes.outputs.infra_changed == 'true'
      run: terraform plan -out=tfplan -no-color
      working-directory: ./terraform

    - name: Check for Destructive Changes
      if: steps.check-changes.outputs.infra_changed == 'true'
      working-directory: ./terraform
      run: |
        # Use terraform show -json to inspect proposed changes
        PLAN_JSON=$(terraform show -json tfplan)
        
        # Parse proposed actions using jq. Look for "delete" actions
        DESTRUCTIVE_COUNT=$(echo "$PLAN_JSON" | jq '[.resource_changes[]? | select(.change.actions[] | select(. == "delete"))] | length')
        
        echo "Found $DESTRUCTIVE_COUNT resource destruction(s) in plan."
        
        if [ "$DESTRUCTIVE_COUNT" -gt 0 ]; then
          echo "::error::Destructive changes (resource deletion/replacement) detected in Terraform plan! Automated apply is blocked. Please review and apply manually."
          exit 1
        fi

    - name: Terraform Apply
      if: steps.check-changes.outputs.infra_changed == 'true'
      run: terraform apply -auto-approve tfplan
      working-directory: ./terraform

    # ─── Docker Build & Push (Always Runs) ──────────────────────────────────────
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Create ECR Repository if not exists
      run: |
        aws ecr describe-repositories --repository-names $ECR_REPOSITORY \
          --region $AWS_REGION 2>/dev/null || \
          aws ecr create-repository --repository-name $ECR_REPOSITORY \
          --region $AWS_REGION

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

    # ─── Deploy to EKS (Always Runs) ───────────────────────────────────────────
    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

    - name: Deploy to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Replace image in deployment.yaml with new ECR image
        sed -i "s|image:.*video-chat-app.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl rollout restart deployment/video-chat-app -n video-chat
        kubectl rollout status deployment/video-chat-app -n video-chat --timeout=180s

    # ─── ELB Node Registration (Always Runs) ────────────────────────────────────
    - name: Register EKS nodes with Load Balancer
      run: |
        ELB_HOST=$(kubectl get svc video-chat-service -n video-chat \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

        if [ -z "$ELB_HOST" ]; then
          echo "No ELB hostname found yet, skipping node registration."
          exit 0
        fi

        ELB_NAME=$(echo "$ELB_HOST" | awk -F'-' '{print $1}')
        echo "ELB Name: $ELB_NAME"

        # Get EC2 instance IDs (not node DNS names) via AWS API
        NODE_DNS_NAMES=$(kubectl get nodes \
          -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)

        if [ -z "$NODE_DNS_NAMES" ]; then
          echo "No nodes found, skipping."
          exit 0
        fi

        INSTANCE_IDS=""
        for DNS in $NODE_DNS_NAMES; do
          ID=$(aws ec2 describe-instances \
            --region $AWS_REGION \
            --filters "Name=private-dns-name,Values=$DNS" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)
          if [ -n "$ID" ] && [ "$ID" != "None" ]; then
            INSTANCE_IDS="$INSTANCE_IDS $ID"
          fi
        done

        INSTANCE_IDS=$(echo "$INSTANCE_IDS" | xargs)
        if [ -n "$INSTANCE_IDS" ]; then
          echo "Registering instances: $INSTANCE_IDS with ELB: $ELB_NAME"
          aws elb register-instances-with-load-balancer \
            --load-balancer-name "$ELB_NAME" \
            --instances $INSTANCE_IDS \
            --region $AWS_REGION || true
        else
          echo "No valid instance IDs found, skipping registration."
        fi
